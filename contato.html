<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav>
            <ul>
                <a href="index.html">Home</a>
                <a href="sobre.html">Sobre</a>
                <a href="contato.html">Contato</a>
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/8c/SENAI_S%C3%A3o_Paulo_logo.png"
                alt="logo"
                width="100px"
                height="20px">
            </ul>
        </nav>
    </header>

    <main>
         <!--Conteudo-->
       <form id="formContato">
        <label for="nome">Nome:</label>
        <input
          type="text"
          id="nome"
          name="nome"
          required
          placeholder="Digite seu nome"
        />
        <label for="email">E-mail:</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          placeholder="Digite seu E-mail"
        />
        <label for="mensagem">Mensagem:</label>
        <textarea
          name="mensagem"
          id="mensagem"
          required
          placeholder="Digite sua mensagem"
        ></textarea>
        <button type="submit" id="btnWhatsapp">Enviar</button>
      </form>
        
      <script src="script.js"></script>
    </main>

    <footer>
        
    </footer>
    
</body>
</html>
